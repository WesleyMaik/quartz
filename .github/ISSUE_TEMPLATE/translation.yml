name: Translation issue
description: Report a wrong, unnatural or missing translation in the Quartz interface.
title: "[Translation]: "
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        Quartz translations are made with AI, so corrections from people who speak the language are very welcome. You can write in English or in the language you are reporting.
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - Português
        - Español
        - 简体中文
        - 繁體中文
        - 日本語
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where does the text appear?
      placeholder: Settings > Editor > Language
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
      description: Copy the text as the interface shows it. Do not include content from your documents.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why is it better?
      description: Optional. A screenshot also helps.
