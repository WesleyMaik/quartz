<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Quartz - LaTeX and Typst Editor</title>
    <meta name="description" content="An AI-native and local-first LaTeX and Typst editor that runs in your browser." />
    <meta name="application-name" content="Quartz" />
    <meta name="theme-color" content="#7c3aed" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/quartz-logo-256x256.png" />
    <link rel="canonical" href="%QUARTZ_SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quartz" />
    <meta property="og:title" content="Quartz - LaTeX and Typst Editor" />
    <meta property="og:description" content="An AI-native and local-first LaTeX and Typst editor that runs in your browser." />
    <meta property="og:url" content="%QUARTZ_SITE_URL%/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="%QUARTZ_SITE_URL%/quartz-opengraph.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Quartz, a local-first LaTeX and Typst editor" />
    <meta property="og:image" content="%QUARTZ_SITE_URL%/quartz-feature-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1254" />
    <meta property="og:image:height" content="1254" />
    <meta property="og:image:alt" content="Quartz crystal logo" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quartz - LaTeX and Typst Editor" />
    <meta name="twitter:description" content="An AI-native and local-first LaTeX and Typst editor that runs in your browser." />
    <meta name="twitter:image" content="%QUARTZ_SITE_URL%/quartz-opengraph.png" />
    <meta name="twitter:image:alt" content="Quartz, a local-first LaTeX and Typst editor" />
    <script>
      try {
        const theme = localStorage.getItem("quartz:theme");
        const dark = theme === "dark" || (theme === null && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
